name: "FreeRADIUS für Omada"
description: "Minimaler RADIUS-Ersatz für den Omada OC200 Controller"
version: "0.1.7"
slug: "freeradius_omada"
init: false
arch:
  - amd64
  - aarch64
startup: services
# Das aktiviert den API-Proxy-Zugriff für das Skript:
homeassistant_api: true
ports:
  1812/udp: 1812
  1813/udp: 1813
options:
  shared_secret: "MeinSicheresMasterPasswort123"
schema:
  shared_secret: password

